# основной деплой плюс веб-чат
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm

resources:
  - ../k8s
  - deployment.yaml
  - service.yaml

# свой Secret, а не merge в vllm-secrets
secretGenerator:
  - name: chat-secrets
    envs: [secrets.env]

images:
  - name: chat-web
    newTag: 0.1.0
