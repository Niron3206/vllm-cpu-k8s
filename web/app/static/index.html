<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат с моделью</title>
<link rel="stylesheet" href="chat.css">
<script src="chat.js" defer></script>
</head>
<body>
<header>
  <h1>Чат <span id="model"></span></h1>
  <button id="reset" type="button">Новый чат</button>
</header>
<details>
  <summary>Настройки</summary>
  <label>Системный промпт<textarea id="system" rows="2"></textarea></label>
  <label>temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label>
  <label>max_tokens<input id="max-tokens" type="number" min="1" max="1024" value="512"></label>
</details>
<main id="log"></main>
<form id="form">
  <textarea id="prompt" rows="3" required
    placeholder="Сообщение. Enter отправляет, Shift+Enter переносит строку"></textarea>
  <button id="send" type="submit">Отправить</button>
  <button id="stop" type="button" hidden>Стоп</button>
</form>
</body>
</html>
