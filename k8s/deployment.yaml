apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      automountServiceAccountToken: false
      # иначе Service vllm добавит в под VLLM_PORT=tcp://..., а vllm читает его как свой порт
      enableServiceLinks: false
      # SYS_NICE и seccomp Unconfined из CPU доков vllm нужны для NUMA-привязки памяти
      # на одной NUMA-ноде они ничего не дают, поэтому их нет
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-downloader
          image: model-downloader
          envFrom:
            - configMapRef:
                name: vllm-env
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: vllm
          image: vllm-cpu
          args: ["$(MODEL_DIR)", "--config", "/etc/vllm/serve.yaml"]
          envFrom:
            - configMapRef:
                name: vllm-env
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "10"
              memory: 9Gi
            limits:
              cpu: "10"
              memory: 9Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: vllm-cache
              mountPath: /var/cache/vllm
            - name: config
              mountPath: /etc/vllm
              readOnly: true
            - name: home
              mountPath: /home/vllm
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: vllm-cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: config
          configMap:
            name: vllm-config
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
