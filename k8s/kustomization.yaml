apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: vllm-env
    envs: [config/vllm.env]
  - name: vllm-config
    files: [config/serve.yaml, config/logging.json]

secretGenerator:
  - name: vllm-secrets
    envs: [secrets.env]
    options:
      disableNameSuffixHash: true

images:
  - name: vllm-cpu
    newTag: 0.32.0
  - name: model-downloader
    newTag: 0.1.0
