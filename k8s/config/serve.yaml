# аргументы vllm serve. Путь к модели и имя для API приходят из vllm.env
host: 0.0.0.0
port: 8000
max-model-len: 8192
# под нагрузкой 128 дало в 2.3 раза больше токенов/с, чем 32 (bench/results/exp-a-*)
max-num-seqs: 128
max-num-batched-tokens: 2048
# около 37 тысяч токенов при ~28 КБ на токен
kv-cache-memory-bytes: 1G
# torch.compile скорости не даёт, а старт удлиняет на полторы минуты
enforce-eager: true
# с vllm_guard сюда пишутся только id и число токеновв без текста
enable-log-requests: true
enable-log-outputs: true
middleware:
  - vllm_guard.auth.BearerAuth
